[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F"]
# Ignored so CI passes on existing code. E712 is a false positive for SQLAlchemy (== True).
ignore = ["E501", "E402", "E712", "F401", "F841"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]